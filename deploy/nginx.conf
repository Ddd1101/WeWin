proxy_cache_path /var/cache/wewin-media levels=1:2 keys_zone=wewin_media:10m max_size=1536m inactive=7d use_temp_path=off;
limit_conn_zone $server_name zone=wewin_uploads:1m;
upstream wewin_media_origin { server 127.0.0.1:10080; keepalive 8; }
server {
    listen 80;
    server_name 47.250.165.79;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://47.250.165.79$request_uri; }
}
server {
    listen 443 ssl;
    server_name 47.250.165.79;
    ssl_certificate /etc/letsencrypt/live/wewin-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wewin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/wewin/web;
    index index.html;
    client_max_body_size 105m;
    client_body_temp_path /var/lib/wewin-upload/nginx;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location ^~ /assets/ { try_files $uri =404; expires 7d; }
    location ~ ^/api/store/products/(create/|[0-9]+/update/) {
        limit_conn wewin_uploads 4;
        limit_conn_status 503;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location ~ ^/(api|health)/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location /admin/ { return 404; }
    location ^~ /static/ { alias /srv/wewin/static/; }
    location ^~ /media/ {
        if ($uri !~* "^/media/products/.*\.(jpg|jpeg|png|webp|gif)$") { return 404; }
        proxy_pass http://wewin_media_origin/objects/;
        include /etc/wewin/media-origin.conf;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_cache wewin_media;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 500 502 504 =503 @media_unavailable;
        add_header X-Content-Type-Options nosniff always;
        add_header X-WeWin-Cache $upstream_cache_status always;
    }
    location @media_unavailable { return 503; }
}
