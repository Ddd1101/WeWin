server {
    listen 80;
    server_name 47.250.165.79;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://47.250.165.79$request_uri; }
}
server {
    listen 443 ssl;
    server_name 47.250.165.79;
    ssl_certificate /etc/letsencrypt/live/wewin-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wewin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/wewin/web;
    index index.html;
    client_max_body_size 105m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location ^~ /assets/ { try_files $uri =404; expires 7d; }
    location ~ ^/(api|health)/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    # Admin is available through an SSH tunnel, not the public Internet.
    location /admin/ { return 404; }
    location ^~ /static/ { alias /srv/wewin/static/; }
    location ^~ /media/ {
        alias /var/lib/wewin/media/;
        autoindex off;
        if ($uri !~* "^/media/products/.*\.(jpg|jpeg|png|webp|gif)$") { return 404; }
        add_header X-Content-Type-Options nosniff always;
    }
}
